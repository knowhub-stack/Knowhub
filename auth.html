<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KNOWHUB — 로그인</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --card: #1c2333;
  --border: #30363d;
  --accent: #f0b429;
  --accent2: #3fb950;
  --text: #e6edf3;
  --muted: #8b949e;
  --red: #f85149;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:var(--bg); color:var(--text);
  font-family:'Noto Sans KR',sans-serif;
  min-height:100vh; display:flex; flex-direction:column;
}

/* NAV */
nav {
  padding:20px 40px;
  display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.logo { font-family:'Montserrat',sans-serif; font-weight:900; font-size:22px; text-decoration:none; color:var(--text); }
.logo span { color:var(--accent); }
.nav-back { color:var(--muted); text-decoration:none; font-size:13px; display:flex; align-items:center; gap:6px; transition:color 0.2s; }
.nav-back:hover { color:var(--accent); }

/* MAIN */
.main {
  flex:1; display:flex; align-items:center; justify-content:center;
  padding:40px 20px;
  position:relative; overflow:hidden;
}
.glow1 {
  position:absolute; top:-100px; left:-100px;
  width:400px; height:400px;
  background:radial-gradient(circle, rgba(240,180,41,0.08) 0%, transparent 70%);
  pointer-events:none;
}
.glow2 {
  position:absolute; bottom:-100px; right:-100px;
  width:400px; height:400px;
  background:radial-gradient(circle, rgba(63,185,80,0.06) 0%, transparent 70%);
  pointer-events:none;
}

/* CARD */
.auth-card {
  background:var(--card); border:1px solid var(--border);
  border-radius:16px; padding:48px 40px;
  width:100%; max-width:440px;
  position:relative; z-index:1;
  animation:fadeUp 0.5s ease both;
}
@keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

.auth-logo {
  text-align:center; margin-bottom:32px;
}
.auth-logo .logo-big {
  font-family:'Montserrat',sans-serif; font-weight:900;
  font-size:32px; display:block; margin-bottom:8px;
}
.auth-logo .logo-big span { color:var(--accent); }
.auth-logo p { font-size:14px; color:var(--muted); }

/* TABS */
.tabs {
  display:flex; background:var(--surface);
  border-radius:10px; padding:4px; margin-bottom:32px;
}
.tab {
  flex:1; padding:10px; text-align:center;
  font-size:14px; font-weight:600; cursor:pointer;
  border-radius:8px; transition:all 0.2s; color:var(--muted);
  border:none; background:none; font-family:'Noto Sans KR';
}
.tab.active { background:var(--card); color:var(--text); box-shadow:0 2px 8px rgba(0,0,0,0.3); }

/* FORM */
.form-section { display:none; }
.form-section.active { display:block; }

.fg { margin-bottom:18px; }
.fl {
  display:block; font-size:11px; font-weight:700;
  letter-spacing:1.5px; color:var(--muted);
  margin-bottom:8px; text-transform:uppercase;
}
.fi {
  width:100%; padding:13px 16px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:8px; color:var(--text);
  font-family:'Noto Sans KR'; font-size:14px; outline:none;
  transition:border-color 0.2s;
}
.fi:focus { border-color:var(--accent); }
.fi::placeholder { color:var(--muted); }

.role-select {
  display:grid; grid-template-columns:1fr 1fr; gap:10px;
  margin-bottom:18px;
}
.role-btn {
  padding:14px; border:1px solid var(--border);
  border-radius:8px; background:var(--surface);
  color:var(--muted); font-size:13px; font-weight:600;
  cursor:pointer; transition:all 0.2s; text-align:center;
  font-family:'Noto Sans KR';
}
.role-btn:hover { border-color:var(--accent); color:var(--text); }
.role-btn.selected { border-color:var(--accent); background:rgba(240,180,41,0.08); color:var(--accent); }
.role-icon { font-size:24px; display:block; margin-bottom:6px; }

.submit-btn {
  width:100%; padding:15px; background:var(--accent);
  color:#000; border:none; border-radius:8px;
  font-size:15px; font-weight:700; font-family:'Noto Sans KR';
  cursor:pointer; transition:all 0.2s; margin-top:8px;
}
.submit-btn:hover { background:#e0a500; transform:translateY(-1px); }
.submit-btn:disabled { background:#555; color:#888; cursor:not-allowed; transform:none; }

.divider {
  display:flex; align-items:center; gap:12px;
  margin:24px 0; color:var(--muted); font-size:12px;
}
.divider::before, .divider::after {
  content:''; flex:1; height:1px; background:var(--border);
}

.social-btn {
  width:100%; padding:13px; background:var(--surface);
  border:1px solid var(--border); border-radius:8px;
  color:var(--text); font-size:14px; font-weight:600;
  cursor:pointer; transition:all 0.2s; font-family:'Noto Sans KR';
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin-bottom:10px;
}
.social-btn:hover { border-color:var(--muted); background:#1f2937; }

.form-note { font-size:12px; color:var(--muted); text-align:center; margin-top:16px; line-height:1.6; }
.form-note a { color:var(--accent); text-decoration:none; }

/* ALERT */
.alert {
  padding:12px 16px; border-radius:8px;
  font-size:13px; margin-bottom:16px; display:none;
}
.alert.error { background:rgba(248,81,73,0.1); border:1px solid rgba(248,81,73,0.3); color:var(--red); }
.alert.success { background:rgba(63,185,80,0.1); border:1px solid rgba(63,185,80,0.3); color:var(--accent2); }
.alert.show { display:block; }

/* LOADING */
.spinner {
  width:18px; height:18px; border:2px solid rgba(0,0,0,0.3);
  border-top-color:#000; border-radius:50%;
  animation:spin 0.8s linear infinite; display:inline-block;
}
@keyframes spin { to{transform:rotate(360deg)} }

/* SUCCESS SCREEN */
.success-screen {
  display:none; text-align:center;
  animation:fadeUp 0.5s ease both;
}
.success-screen.show { display:block; }
.success-icon { font-size:64px; margin-bottom:20px; }
.success-screen h2 { font-family:'Montserrat',sans-serif; font-weight:900; font-size:28px; margin-bottom:12px; }
.success-screen p { color:var(--muted); font-size:14px; line-height:1.7; margin-bottom:28px; }
.go-btn {
  display:inline-block; background:var(--accent); color:#000;
  padding:14px 36px; border-radius:8px; font-weight:700;
  text-decoration:none; font-size:14px; transition:background 0.2s;
}
.go-btn:hover { background:#e0a500; }

/* FOOTER */
footer {
  padding:24px 40px; border-top:1px solid var(--border);
  text-align:center; font-size:12px; color:var(--muted);
}

@media(max-width:480px) {
  .auth-card { padding:32px 24px; }
  nav { padding:16px 20px; }
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">KNOW<span>HUB</span></a>
  <a href="index.html" class="nav-back">← 메인으로</a>
</nav>

<div class="main">
  <div class="glow1"></div>
  <div class="glow2"></div>

  <div class="auth-card">

    <!-- LOGO -->
    <div class="auth-logo">
      <span class="logo-big">KNOW<span>HUB</span></span>
      <p>전문 지식 마켓플레이스</p>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">로그인</button>
      <button class="tab" onclick="switchTab('signup')">회원가입</button>
    </div>

    <!-- ALERT -->
    <div class="alert" id="alert"></div>

    <!-- LOGIN FORM -->
    <div class="form-section active" id="loginForm">
      <div class="fg">
        <label class="fl">이메일</label>
        <input class="fi" type="email" id="loginEmail" placeholder="hello@example.com">
      </div>
      <div class="fg">
        <label class="fl">비밀번호</label>
        <input class="fi" type="password" id="loginPw" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')login()">
      </div>
      <div style="text-align:right;margin-bottom:20px">
        <a href="#" style="font-size:12px;color:var(--muted);text-decoration:none" onclick="forgotPassword()">비밀번호 찾기</a>
      </div>
      <button class="submit-btn" id="loginBtn" onclick="login()">로그인</button>

      <div class="divider">또는</div>

      <button class="social-btn" onclick="loginWithKakao()">
        <span style="font-size:18px">💬</span> 카카오로 로그인
      </button>
      <button class="social-btn" onclick="loginWithGoogle()">
        <span style="font-size:18px">🔍</span> 구글로 로그인
      </button>

      <p class="form-note">
        계정이 없으신가요? <a onclick="switchTab('signup')" style="cursor:pointer">회원가입</a>
      </p>
    </div>

    <!-- SIGNUP FORM -->
    <div class="form-section" id="signupForm">
      <div class="fg">
        <label class="fl">가입 유형 선택</label>
        <div class="role-select">
          <button class="role-btn selected" id="roleStudent" onclick="selectRole('student')">
            <span class="role-icon">🎓</span>수강생
          </button>
          <button class="role-btn" id="roleInstructor" onclick="selectRole('instructor')">
            <span class="role-icon">👨‍🏫</span>강사
          </button>
        </div>
      </div>
      <div class="fg">
        <label class="fl">이름</label>
        <input class="fi" type="text" id="signupName" placeholder="홍길동">
      </div>
      <div class="fg">
        <label class="fl">이메일</label>
        <input class="fi" type="email" id="signupEmail" placeholder="hello@example.com">
      </div>
      <div class="fg">
        <label class="fl">비밀번호</label>
        <input class="fi" type="password" id="signupPw" placeholder="8자 이상 입력">
      </div>
      <div class="fg">
        <label class="fl">비밀번호 확인</label>
        <input class="fi" type="password" id="signupPw2" placeholder="비밀번호 재입력" onkeydown="if(event.key==='Enter')signup()">
      </div>
      <button class="submit-btn" id="signupBtn" onclick="signup()">회원가입</button>

      <div class="divider">또는</div>

      <button class="social-btn" onclick="loginWithGoogle()">
        <span style="font-size:18px">🔍</span> 구글로 가입
      </button>

      <p class="form-note">
        이미 계정이 있으신가요? <a onclick="switchTab('login')" style="cursor:pointer">로그인</a><br>
        가입 시 <a href="#">이용약관</a> 및 <a href="#">개인정보처리방침</a>에 동의합니다.
      </p>
    </div>

    <!-- SUCCESS SCREEN -->
    <div class="success-screen" id="successScreen">
      <div class="success-icon">🎉</div>
      <h2>가입 완료!</h2>
      <p>이메일로 인증 링크를 보냈어요.<br>메일함을 확인하고 인증을 완료해주세요.<br><br><span style="color:var(--accent)">스팸함도 확인해보세요!</span></p>
      <a href="index.html" class="go-btn">메인으로 가기</a>
    </div>

  </div>
</div>

<footer>© 2025 KNOWHUB. All rights reserved.</footer>

<script>
// ⚠️ 여기에 Supabase 정보를 입력하세요
const SUPABASE_URL = 'https://ehywosglvafxudlwhwpm.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_lzc4tLfDiKsQ8qElnxOYmA_mQ6Da31x'

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

let selectedRole = 'student'

// 탭 전환
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', (tab==='login'&&i===0)||(tab==='signup'&&i===1))
  })
  document.getElementById('loginForm').classList.toggle('active', tab==='login')
  document.getElementById('signupForm').classList.toggle('active', tab==='signup')
  hideAlert()
}

// 역할 선택
function selectRole(role) {
  selectedRole = role
  document.getElementById('roleStudent').classList.toggle('selected', role==='student')
  document.getElementById('roleInstructor').classList.toggle('selected', role==='instructor')
}

// 알림 표시
function showAlert(msg, type='error') {
  const el = document.getElementById('alert')
  el.textContent = msg
  el.className = `alert ${type} show`
}
function hideAlert() {
  document.getElementById('alert').className = 'alert'
}

// 로딩 상태
function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId)
  btn.disabled = loading
  btn.innerHTML = loading ? '<span class="spinner"></span>' : btnId==='loginBtn' ? '로그인' : '회원가입'
}

// 로그인
async function login() {
  const email = document.getElementById('loginEmail').value.trim()
  const pw = document.getElementById('loginPw').value
  if (!email || !pw) return showAlert('이메일과 비밀번호를 입력해주세요.')
  setLoading('loginBtn', true)
  hideAlert()
  const { data, error } = await supabase.auth.signInWithPassword({ email, password: pw })
  setLoading('loginBtn', false)
  if (error) return showAlert('이메일 또는 비밀번호가 올바르지 않아요.')
  showAlert('로그인 성공! 잠시 후 이동합니다.', 'success')
  setTimeout(() => window.location.href = 'index.html', 1200)
}

// 회원가입
async function signup() {
  const name = document.getElementById('signupName').value.trim()
  const email = document.getElementById('signupEmail').value.trim()
  const pw = document.getElementById('signupPw').value
  const pw2 = document.getElementById('signupPw2').value
  if (!name || !email || !pw || !pw2) return showAlert('모든 항목을 입력해주세요.')
  if (pw.length < 8) return showAlert('비밀번호는 8자 이상이어야 해요.')
  if (pw !== pw2) return showAlert('비밀번호가 일치하지 않아요.')
  setLoading('signupBtn', true)
  hideAlert()
  const { data, error } = await supabase.auth.signUp({
    email, password: pw,
    options: { data: { name, role: selectedRole } }
  })
  setLoading('signupBtn', false)
  if (error) return showAlert(error.message.includes('already') ? '이미 사용 중인 이메일이에요.' : '오류가 발생했어요. 다시 시도해주세요.')
  document.getElementById('loginForm').style.display = 'none'
  document.getElementById('signupForm').style.display = 'none'
  document.querySelector('.tabs').style.display = 'none'
  document.querySelector('.auth-logo').style.display = 'none'
  document.getElementById('alert').style.display = 'none'
  document.getElementById('successScreen').classList.add('show')
}

// 비밀번호 찾기
async function forgotPassword() {
  const email = document.getElementById('loginEmail').value.trim()
  if (!email) return showAlert('이메일을 먼저 입력해주세요.')
  const { error } = await supabase.auth.resetPasswordForEmail(email)
  if (error) return showAlert('오류가 발생했어요.')
  showAlert('비밀번호 재설정 이메일을 보냈어요!', 'success')
}

// 구글 로그인
async function loginWithGoogle() {
  await supabase.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + '/index.html' }
  })
}

// 카카오 로그인 (추후 연동)
function loginWithKakao() {
  showAlert('카카오 로그인은 준비 중이에요.', 'success')
}

// 이미 로그인된 경우 메인으로
supabase.auth.getSession().then(({ data }) => {
  if (data.session) window.location.href = 'index.html'
})
</script>
</body>
</html>
